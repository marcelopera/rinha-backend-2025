services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - payment-processor
  api:
    build:
      context: .
      dockerfile: Dockerfile.jvm
    ports:
      - "8080:8080"
    depends_on:
      - redis
    networks:
      - payment-processor

networks:
  payment-processor: